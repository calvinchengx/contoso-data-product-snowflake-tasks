# The leaf's own tests: no platform, no emulator, no Docker.
#
# A leaf is the half of a cell that a Snowflake team would actually write, and
# it has to stand on its own — clone it, resolve it, run its tests. That is DoD
# item 1 in the family plan, and it is checkable here in seconds rather than
# only in the platform's acceptance run.
#
# THE PIPELINE ITSELF IS NOT RUN HERE. That needs the emulator, the four vendors
# and a stack, and it belongs in snowflake-platform-tasks's acceptance workflow,
# which checks this repository out and runs `make verify PRODUCT=...` against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

  # PROOF HAS TO REFRESH ITSELF. ci.yml ran on push and pull_request only, so
  # with no commits its last green just aged, to 2026-08-24 -- while CodeQL
  # and Product bump, which do carry a `schedule`, both ran 2026-09-07. The
  # repo already demonstrates the fix on itself.
  # A fortnight-old green is not evidence that the build still works against
  # the ecosystem it pulls from, and the hub flags anything past 14 days.
  # Weekly at 04:51, clear of the 05:00 daily Product bump. Two jobs, no
  # secrets, so the cost is negligible against knowing.
  schedule:
    - cron: '51 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # --frozen: the lockfile is the claim. A CI run that silently resolved a
      # different dependency set would be testing something no one else has.
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --no-sync --group dev ruff check .
      - name: tests
        run: uv run --frozen --no-sync --group dev pytest tests -q
      # A SKIPPED TEST IS NOT A PASSING ONE. These tests are what stand between
      # this leaf and a second copy of core's SQL, so CI fails if the suite
      # quietly shrinks to nothing.
      - name: the suite actually ran
        run: |
          uv run --frozen --no-sync --group dev pytest tests -q 2>&1 | tee /tmp/out
          grep -qE "^[0-9]+ passed" /tmp/out
      # THE STEPS MUST IMPORT. The tests above read them as text; this is the
      # only thing here that proves the dependency groups actually carry what
      # the code reaches for. `engine` and `dbt` conflict by declaration, so
      # they are resolved one at a time, exactly as the platform runs them.
      - name: the engine steps import
        run: |
          uv sync --frozen --group engine
          uv run --frozen --no-sync --group engine python -c "
          import sys; sys.path.insert(0, 'steps')
          import bronze, ingest, provision, govern, stage, target
          print('engine steps import')"
